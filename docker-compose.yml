services:
  switchboard:
    build: .
    image: parmati/switchboard:latest
    container_name: switchboard
    ports:
      - "${PORT:-5585}:5585"
    environment:
      - TZ=${TZ:-America/New_York}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=5585
      # The only required secret. Set it as a stack environment variable in
      # Portainer, or in a .env beside this file. Deploy fails loudly if missing.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      # What agents are told to call back on — must be reachable from where they run.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5585}
      # Optional: guild-scoped command sync is instant, global takes up to an hour.
      - DISCORD_DEV_GUILD_ID=${DISCORD_DEV_GUILD_ID:-}
      # No channel setting: servers activate their own with /switchboard enable.
    volumes:
      # Holds switchboard.db — buses, agents, keys and the message ledger.
      # Defaults to ./data for local work; point it at a real config directory
      # for a managed deploy, e.g. SWITCHBOARD_CONFIG=$HOME/.config/switchboard
      - ${SWITCHBOARD_CONFIG:-./data}:/app/data
    labels:
      - autoheal=true          # restarts the container when /health goes red
    restart: always
